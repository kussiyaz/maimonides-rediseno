<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus UMAI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Login -->
    <div id="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="logo"></div>
          <h1>Campus UMAI</h1>
          <p class="subtitle">Ingresá con tu cuenta</p>
        </div>
        <form id="login-form">
          <div class="field">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" placeholder="ej: yazmin" autocomplete="off" required>
          </div>
          <div class="field">
            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" placeholder="••••••••" required>
          </div>
          <button type="submit">Ingresar</button>
          <p id="login-error" class="error-msg"></p>
        </form>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-container" class="hidden">
      <header>
        <div class="header-left">
          <div class="logo small"></div>
          <h2>Campus UMAI</h2>
        </div>
        <button id="btn-logout" class="btn-outline">Cerrar sesión</button>
      </header>
      <main>
        <section class="welcome">
          <h3 id="alumno-nombre"></h3>
          <p>Panel de materias</p>
        </section>
        <section class="cards-container" id="materias-container">
          <!-- Materias se renderizan acá -->
        </section>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
